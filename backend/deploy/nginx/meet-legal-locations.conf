# Include these exact-match locations inside the existing HTTPS server block
# for meet.ritzla.in. Leave the existing catch-all proxy to port 3010 intact.
# Only legal paths go to ADDA's backend on port 3000.

location = /terms {
    proxy_pass http://127.0.0.1:3000/terms;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

